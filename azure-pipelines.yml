# Azure Pipelines CI/CD definition for the TTB Label Verification prototype.
#
# Pull requests targeting main are built and tested but never deployed.
# Changes merged to main are built, tested, packaged once, and the same
# validated artifact is deployed to the Azure prototype environment.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  solution: LabelVerification.slnx
  webProject: src/LabelVerification.Web/LabelVerification.Web.csproj

  # Azure deployment configuration.
  azureServiceConnection: sc-ttb-label-verification-prototype
  webAppName: ttb-label-verification-iwluomsqzvz26
  webAppUrl: https://ttb-label-verification-iwluomsqzvz26.azurewebsites.net

stages:

# ===========================================================================
# BUILD, TEST, AND PACKAGE
# ===========================================================================
# Runs for both pull requests and main-branch CI.
# No Azure deployment occurs from a pull-request build.
- stage: BuildAndTest
  displayName: Build, Test, and Package

  jobs:
  - job: Build
    displayName: Build and validate application

    steps:

    # The application targets net8.0, so the hosted agent needs the .NET 8
    # runtime to execute unit and integration test assemblies.
    - task: UseDotNet@2
      displayName: Install .NET 8 SDK and runtime
      inputs:
        packageType: sdk
        version: '8.0.x'

    # SDK 10.0.300 is the repository build toolchain and supports the .slnx
    # solution format. The application itself continues to target net8.0.
    - task: UseDotNet@2
      displayName: Install .NET 10 SDK
      inputs:
        packageType: sdk
        version: '10.0.300'

    - script: dotnet restore $(solution)
      displayName: Restore dependencies

    - script: >
        dotnet build $(solution)
        --configuration $(buildConfiguration)
        --no-restore
      displayName: Build solution

    - script: >
        dotnet test $(solution)
        --configuration $(buildConfiguration)
        --no-build
        --logger "trx"
        --results-directory "$(Agent.TempDirectory)/TestResults"
      displayName: Run deterministic automated tests
      env:
        RUN_LIVE_OCR_TESTS: "false"

    # Preserve test evidence even when a test fails.
    - task: PublishTestResults@2
      displayName: Publish test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true

    # Produce the deployable Web application only after successful validation.
    - script: >
        dotnet publish $(webProject)
        --configuration $(buildConfiguration)
        --no-build
        --output "$(Build.ArtifactStagingDirectory)/web"
      displayName: Publish web application

    # Package the already-built application into a deterministic deployment
    # artifact. Deployment will consume this ZIP without rebuilding source.
    - task: ArchiveFiles@2
      displayName: Package web application
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/web'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/label-verification-web.zip'
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: Publish application artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/label-verification-web.zip'
        artifact: label-verification-web
        publishLocation: pipeline


# ===========================================================================
# DEPLOY
# ===========================================================================
# Deploy only after a successful main-branch build.
#
# Pull requests execute BuildAndTest but this stage is intentionally skipped,
# preventing unmerged code from modifying the evaluator-facing environment.
- stage: Deploy
  displayName: Deploy Prototype to Azure
  dependsOn: BuildAndTest

  condition: >
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:
  - job: DeployWeb
    displayName: Deploy validated artifact

    steps:

    # Download the exact artifact produced by the BuildAndTest stage.
    - task: DownloadPipelineArtifact@2
      displayName: Download validated application artifact
      inputs:
        buildType: current
        artifactName: label-verification-web
        targetPath: '$(Pipeline.Workspace)/label-verification-web'

    # Deploy the previously validated package to the Linux App Service.
    - task: AzureWebApp@1
      displayName: Deploy to Azure App Service
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        appType: webAppLinux
        appName: '$(webAppName)'
        package: '$(Pipeline.Workspace)/label-verification-web/label-verification-web.zip'
        runtimeStack: 'DOTNETCORE|8.0'

    # Confirm that App Service restarted successfully and that the application
    # responds through its operational health endpoint.
    - bash: |
        set -e

        HEALTH_URL="$(webAppUrl)/health"

        echo "Checking application health at ${HEALTH_URL}"

        curl \
          --fail \
          --silent \
          --show-error \
          --location \
          --retry 12 \
          --retry-delay 5 \
          --retry-all-errors \
          "${HEALTH_URL}"

        echo
        echo "Deployment health check succeeded."
      displayName: Smoke test deployed /health endpoint
